name: Update profile card

on:
  schedule:
    - cron: "0 3 * * *"   # daily, 03:00 UTC
  workflow_dispatch:
  push:
    paths: [generate.py, assets/ascii.txt]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ACCESS_TOKEN (a PAT with repo read) lets the card count private repos too;
      # without it the run is skipped so the count never drops back to public-only
      - run: |
          if [ -z "$ACCESS_TOKEN" ]; then echo "ACCESS_TOKEN secret not set, skipping"; exit 0; fi
          python generate.py
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile.svg README.md
          if ! git diff --cached --quiet; then
            git commit -m "Update profile card stats"
            git push
          fi
